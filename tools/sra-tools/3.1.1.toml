[tool]
id = "sra-tools"
version = "3.1.1"
description = "NCBI SRA Toolkit: download and convert SRA archives to FASTQ/SAM"
homepage = "https://github.com/ncbi/sra-tools"
license = "Public Domain"
tier = "core"
maintainers = [ "github:ncbi",]
cache_paths = [ "/cache/sra",]
[[tool.inputs]]
name = "accession"
type = "file"
cardinality = "one"
description = "SRA accession ID (e.g. SRR1234567)"

[[tool.outputs]]
name = "fastq"
type = "fastq"
cardinality = "many"
description = "Extracted FASTQ reads"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/sra-tools:3.1.1--h4304569_2"

[tool.hardware]
cpu_cores = 4
ram_gb = 8.0
disk_gb = 100.0

[tool.entrypoint]
command = "prefetch"

[tool.binaries]
exposed = [ "prefetch", "fasterq-dump", "fastq-dump", "sra-stat", "vdb-validate", "vdb-dump", "sam-dump", "sff-dump", "abi-dump", "kar",]

[tool.factored]
spec_path = "specs/sra-tools/3.1.1.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/sra-tools:3.1.1"
image_digest = "sha256:6a7116fbb55721ccce0abf4a692d9d27a8cc55f6a756481a69f742a82a1c99e7"
