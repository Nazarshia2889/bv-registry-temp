[tool]
id = "deepvariant"
version = "1.10.0"
description = "DeepVariant: deep learning variant caller for short and long reads"
homepage = "https://github.com/google/deepvariant"
license = "BSD-3-Clause"
tier = "community"
maintainers = [ "github:google",]
[[tool.inputs]]
name = "bam"
type = "bam"
cardinality = "one"
description = "Aligned reads in BAM format"

[[tool.inputs]]
name = "reference"
type = "fasta"
cardinality = "one"
description = "Reference genome FASTA"

[[tool.outputs]]
name = "vcf"
type = "vcf"
cardinality = "one"
description = "Called variants in VCF format"

[tool.image]
backend = "docker"
reference = "google/deepvariant:1.6.1"

[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 10.0

[tool.entrypoint]
command = "run_deepvariant"
args_template = "--model_type=WGS --ref={reference} --reads={bam} --output_vcf={vcf} --num_shards={cpu_cores}"

[tool.binaries]
exposed = [ "run_deepvariant",]

[tool.factored]
spec_path = "specs/deepvariant/1.10.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/deepvariant:1.10.0"
image_digest = "sha256:0f34b98549363b9c587631ba9e145fb5b0ea6b932e416a281cac098073d473cc"


[tool.hardware.gpu]
required = false
min_vram_gb = 8
cuda_version = "11.8"
