[tool]
id = "macs3"
version = "3.0.1"
description = "Model-based Analysis of ChIP-seq: peak calling for ChIP/ATAC-seq"
homepage = "https://github.com/macs3-project/MACS"
license = "BSD-3-Clause"
tier = "core"
maintainers = ["github:macs3-project"]

[[tool.inputs]]
name = "bam"
type = "bam"
cardinality = "one"
description = "ChIP/ATAC alignment"

[[tool.outputs]]
name = "peaks"
type = "file"
cardinality = "one"
description = "Called peaks (narrowPeak/broadPeak)"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/macs3:3.0.1--py39he47c912_3"

[tool.hardware]
cpu_cores = 4
ram_gb = 16.0
disk_gb = 10.0

[tool.entrypoint]
command = "macs3"

[tool.binaries]
exposed = ["macs3"]

[tool.factored]
spec_path = "specs/macs3/3.0.1.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/macs3:3.0.1"
image_digest = "sha256:7f3793470fd370ad0f082d96c209a4eaa5e3b13a3f2263c81797820175dba4ce"
