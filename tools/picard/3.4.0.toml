[tool]
id = "picard"
version = "3.4.0"
description = "Java tools for working with NGS data in the BAM format"
homepage = "http://broadinstitute.github.io/picard/"
license = "MIT"
tier = "community"
maintainers = ["github:broadinstitute"]

[[tool.inputs]]
name = "input"
type = "bam"
cardinality = "one"
description = "Input BAM/SAM/CRAM file"

[[tool.outputs]]
name = "output"
type = "bam"
cardinality = "one"
description = "Output BAM/SAM/CRAM file"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/picard:3.4.0--hdfd78af_0"
digest = "sha256:96b49340dea0ef5bc402d865a2b02032949f13ee57151909328d4eb1b3bcecbc"

[tool.hardware]
cpu_cores = 4
ram_gb = 16.0
disk_gb = 5.0

[tool.entrypoint]
command = "picard"

[tool.binaries]
exposed = ["picard"]

[tool.factored]
spec_path = "specs/picard/3.4.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/picard:3.4.0"
image_digest = "sha256:9d67f964c7809d274867b852eb75ce8716533ed2d1dd9ca526e5cf93f4157db6"
