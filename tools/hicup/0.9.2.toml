[tool]
id = "hicup"
version = "0.9.2"
description = "Hi-C pipeline for mapping, filtering, and QC"
homepage = "https://www.bioinformatics.babraham.ac.uk/projects/hicup/"
license = "GPL-3.0"
tier = "community"
maintainers = ["github:StevenWingett"]

[[tool.inputs]]
name = "reads"
type = "fastq"
cardinality = "many"
description = "Hi-C paired reads"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Filtered Hi-C alignments + QC"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/hicup:0.9.2--hdfd78af_1"

[tool.hardware]
cpu_cores = 8
ram_gb = 32.0
disk_gb = 50.0

[tool.entrypoint]
command = "hicup"

[tool.binaries]
exposed = ["hicup"]
