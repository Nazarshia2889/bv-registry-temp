[tool]
id = "admixture"
version = "1.3.0"
description = "Maximum-likelihood ancestry estimation"
homepage = "https://dalexander.github.io/admixture/"
license = "GPL-3.0"
tier = "community"
maintainers = ["github:dalexander"]

[[tool.inputs]]
name = "bed"
type = "file"
cardinality = "one"
description = "PLINK BED genotypes"

[[tool.outputs]]
name = "out"
type = "file"
cardinality = "one"
description = "Q (ancestry) and P (allele freq) matrices"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/admixture:1.3.0--0"

[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 10.0

[tool.entrypoint]
command = "admixture"

[tool.binaries]
exposed = ["admixture"]
