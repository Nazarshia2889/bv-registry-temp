[tool]
id = "manta"
version = "1.6.0"
description = "Structural variant and indel caller for short reads"
homepage = "https://github.com/Illumina/manta"
license = "GPL-3.0"
tier = "community"
maintainers = [ "github:Illumina",]
[[tool.inputs]]
name = "bam"
type = "bam"
cardinality = "one"
description = "Aligned reads"

[[tool.inputs]]
name = "ref"
type = "fasta"
cardinality = "one"
description = "Reference"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Manta run directory"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/manta:1.6.0--py27h9948957_6"

[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 20.0

[tool.entrypoint]
command = "configManta.py"

[tool.binaries]
exposed = [ "configManta.py",]

[tool.factored]
spec_path = "specs/manta/1.6.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/manta:1.6.0"
image_digest = "sha256:5c1aaf8c95543b1f592aac631f6d56519a27fb71a3af7d4621bc4f9a334a675c"

