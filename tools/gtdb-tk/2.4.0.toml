[tool]
id = "gtdb-tk"
version = "2.4.0"
description = "Genome Taxonomy Database toolkit for placing prokaryotic genomes in GTDB"
homepage = "https://github.com/Ecogenomics/GTDBTk"
license = "GPL-3.0"
tier = "core"
maintainers = ["github:Ecogenomics"]
cache_paths = ["/cache/gtdbtk"]

[[tool.inputs]]
name = "genomes"
type = "dir"
cardinality = "one"
description = "Directory of genome FASTAs"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "GTDB-Tk placement results"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/gtdbtk:2.4.0--pyhdfd78af_2"

[tool.hardware]
cpu_cores = 32
ram_gb = 320.0
disk_gb = 100.0

[tool.entrypoint]
command = "gtdbtk"

[tool.binaries]
exposed = ["gtdbtk"]

[tool.factored]
spec_path = "specs/gtdb-tk/2.4.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/gtdb-tk:2.4.0"
image_digest = "sha256:4b413427c9f148b85ed7091bf557be0b11f2ed820dd0ca20b24bb9428709afa8"
