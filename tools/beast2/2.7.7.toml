[tool]
id = "beast2"
version = "2.7.7"
description = "Bayesian Evolutionary Analysis Sampling Trees (BEAST 2)"
homepage = "https://www.beast2.org/"
license = "LGPL-2.1"
tier = "community"
maintainers = ["github:CompEvol"]

[[tool.inputs]]
name = "xml"
type = "file"
cardinality = "one"
description = "BEAST 2 XML configuration"

[[tool.outputs]]
name = "out"
type = "file"
cardinality = "one"
description = "Posterior trees and trace logs"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/beast2:2.7.7--he65b2d3_0"

[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 10.0

[tool.entrypoint]
command = "beast"

[tool.binaries]
exposed = ["beast", "beauti", "treeannotator", "logcombiner", "applauncher"]

[tool.factored]
spec_path = "specs/beast2/2.7.7.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/beast2:2.7.7"
image_digest = "sha256:270d31e9780f58704b3c6c091c8566bbb28ed89f271b451d440c4d761d3fe5b2"
