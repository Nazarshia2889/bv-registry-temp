[tool]
id = "antismash"
version = "7.1.0"
description = "Detect biosynthetic gene clusters of secondary metabolites"
homepage = "https://antismash.secondarymetabolites.org/"
license = "AGPL-3.0"
tier = "community"
maintainers = [ "github:antismash",]
cache_paths = [ "/cache/antismash",]
[[tool.inputs]]
name = "genome"
type = "fasta"
cardinality = "one"
description = "Bacterial/fungal assembly"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Cluster predictions"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/antismash:7.1.0--pyh7e72e81_1"

[tool.hardware]
cpu_cores = 8
ram_gb = 32.0
disk_gb = 50.0

[tool.entrypoint]
command = "antismash"

[tool.binaries]
exposed = [ "antismash",]

[tool.factored]
spec_path = "specs/antismash/7.1.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/antismash:7.1.0"
image_digest = "sha256:75fa036e89b22ca5d2b18dac00d4da75d2132946d7b1cf549abac72eae59616a"
