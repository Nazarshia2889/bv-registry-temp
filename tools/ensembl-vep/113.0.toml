[tool]
id = "ensembl-vep"
version = "113.0"
description = "Variant Effect Predictor: annotate variants with consequences and regulatory info"
homepage = "https://www.ensembl.org/info/docs/tools/vep/index.html"
license = "Apache-2.0"
tier = "core"
maintainers = ["github:Ensembl"]
cache_paths = ["/cache/vep"]

[[tool.inputs]]
name = "vcf"
type = "vcf"
cardinality = "one"
description = "Variants to annotate"

[[tool.outputs]]
name = "annotated"
type = "vcf"
cardinality = "one"
description = "VEP-annotated variants"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/ensembl-vep:113.0--pl5321h2a3209d_0"

[tool.hardware]
cpu_cores = 4
ram_gb = 16.0
disk_gb = 50.0

[tool.entrypoint]
command = "vep"

[tool.binaries]
exposed = ["vep", "filter_vep", "haplo", "variant_recoder"]

[tool.factored]
spec_path = "specs/ensembl-vep/113.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/ensembl-vep:113.0"
image_digest = "sha256:2fa3635f8acceafbb6741450fcf3c92b2f373119e71aaf679a49b9a101cd8a23"
