[tool]
id = "usalign"
version = "20241201"
description = "Universal structure alignment for monomer, dimer, multimer, and RNA"
homepage = "https://github.com/pylelab/USalign"
license = "Custom"
tier = "core"
maintainers = [ "github:pylelab",]
[[tool.inputs]]
name = "structure1"
type = "pdb"
cardinality = "one"
description = "First structure"

[[tool.inputs]]
name = "structure2"
type = "pdb"
cardinality = "one"
description = "Second structure"

[[tool.outputs]]
name = "out"
type = "file"
cardinality = "one"
description = "Alignment + TM-score"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/usalign:20241201--h503566f_0"

[tool.hardware]
cpu_cores = 2
ram_gb = 4.0
disk_gb = 1.0

[tool.entrypoint]
command = "USalign"

[tool.binaries]
exposed = [ "USalign",]

[tool.factored]
spec_path = "specs/usalign/20241201.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/usalign:20241201"
image_digest = "sha256:4f77f211de20e561ac4e3a5277970d22bab31584f677ed47a1c548dd091a2980"

