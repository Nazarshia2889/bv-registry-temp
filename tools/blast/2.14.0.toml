[tool]
id = "blast"
version = "2.14.0"
description = "BLAST+ Basic Local Alignment Search Tool"
homepage = "https://blast.ncbi.nlm.nih.gov/Blast.cgi"
tier = "core"
maintainers = [ "github:ncbi",]
license = "Public Domain"
[[tool.inputs]]
name = "query"
type = "fasta"
cardinality = "one"
description = "Query sequences in FASTA format"

[[tool.inputs]]
name = "db"
type = "blast_db"
cardinality = "one"
description = "BLAST database directory"

[[tool.outputs]]
name = "output"
type = "blast_tab"
cardinality = "one"
description = "Tabular BLAST alignment results (outfmt 6)"

[tool.image]
backend = "docker"
reference = "ncbi/blast:2.14.0"

[tool.hardware]
cpu_cores = 4
ram_gb = 8.0
disk_gb = 2.0

[tool.entrypoint]
command = "blastn"
args_template = "-query {query} -db {db} -out {output} -num_threads {cpu_cores}"

[tool.binaries]
exposed = [ "blastn", "blastp", "tblastn", "tblastx", "psiblast", "rpsblast", "rpstblastn", "deltablast", "makeblastdb", "makembindex", "makeprofiledb", "blastdbcmd", "blastdb_aliastool", "blastdbcheck", "blast_formatter", "convert2blastmask", "dustmasker", "segmasker", "windowmasker",]

[tool.factored]
spec_path = "specs/blast/2.14.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/blast:2.14.0"
image_digest = "sha256:662ab2ed9b7af3c48d8111ae4348cb2c3b5351c22ce58f696c02097fffc87e72"
