[tool]
id = "nextpolish"
version = "1.4.1"
description = "Genome assembly polisher using short and long reads"
homepage = "https://github.com/Nextomics/NextPolish"
license = "GPL-3.0"
tier = "community"
maintainers = ["github:Nextomics"]

[[tool.inputs]]
name = "config"
type = "file"
cardinality = "one"
description = "NextPolish config file"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Polished assembly"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/nextpolish:1.4.1--h3952c39_7"

[tool.hardware]
cpu_cores = 16
ram_gb = 64.0
disk_gb = 100.0

[tool.entrypoint]
command = "nextPolish"

[tool.binaries]
exposed = ["nextPolish"]
