[tool]
id = "cutadapt"
version = "4.9"
description = "Adapter trimming for high-throughput sequencing reads"
homepage = "https://cutadapt.readthedocs.io/"
license = "MIT"
tier = "core"
maintainers = [ "github:marcelm",]
[[tool.inputs]]
name = "reads"
type = "fastq"
cardinality = "many"
description = "Input FASTQ reads (single or paired)"

[[tool.outputs]]
name = "trimmed"
type = "fastq"
cardinality = "many"
description = "Trimmed FASTQ reads"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/cutadapt:4.9--py39hbcbf7aa_3"

[tool.hardware]
cpu_cores = 4
ram_gb = 8.0
disk_gb = 2.0

[tool.entrypoint]
command = "cutadapt"
args_template = "-o {trimmed} {reads}"

[tool.binaries]
exposed = [ "cutadapt",]

[tool.factored]
spec_path = "specs/cutadapt/4.9.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/cutadapt:4.9"
image_digest = "sha256:a3dc587fc5b9280c7bbdc8bc5f87b82bf17d9a884f0bc689d81e4652e17b3b8e"
