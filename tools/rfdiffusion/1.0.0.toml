[tool]
id          = "rfdiffusion"
version     = "1.1.0"
description = "Diffusion model for protein backbone generation (RoseTTAFold-based): unconditional and symmetric oligomer design, motif scaffolding, de novo binder design, fold conditioning, and partial diffusion / design diversification"
homepage    = "https://github.com/RosettaCommons/RFdiffusion"
license     = "BSD-3-Clause"
tier        = "community"
maintainers = [ "github:RosettaCommons",]

[[tool.inputs]]
name        = "input_pdb"
type        = "pdb"
cardinality = "one"
description = "Optional input structure (inference.input_pdb). Supplies the motif for motif scaffolding, the target for binder design (with 'contigmap.contigs' and 'ppi.hotspot_res'), the scaffold/peptide for fold conditioning, or the starting structure for partial diffusion. Not required for unconditional or symmetric generation."

[[tool.inputs]]
name        = "model_weights"
type        = "dir"
cardinality = "one"
description = "Optional directory of RFdiffusion .pt checkpoints (Base_ckpt.pt, Complex_base_ckpt.pt, ActiveSite_ckpt.pt, InpaintSeq_ckpt.pt, etc.). Sets inference.model_directory_path; defaults to the weights bundled in the image at /app/RFdiffusion/models. The inference script auto-selects the appropriate checkpoint for the requested task."

[[tool.inputs]]
name        = "scaffold_dir"
type        = "dir"
cardinality = "one"
description = "Optional directory of secondary-structure and block-adjacency .pt files for fold conditioning (scaffoldguided.scaffold_dir), produced from PDBs with helper_scripts/make_secstruc_adj.py. Used together with scaffoldguided.scaffoldguided=True."

[[tool.outputs]]
name        = "designs"
type        = "dir"
cardinality = "one"
description = "Output directory selected via inference.output_prefix. Contains one <prefix>_<n>.pdb backbone per design (backbone only, every designed residue emitted as glycine), a matching <prefix>_<n>.trb metadata file (sampled contig, input-to-output residue mapping, inpaint_seq, and the full run config), and a traj/ subdirectory of per-timestep trajectory PDBs (pX0 and Xt-1, stored in reverse order)."

[tool.image]
backend   = "docker"
reference = "docker.io/rosettacommons/rfdiffusion:latest"

[tool.hardware]
cpu_cores = 4
ram_gb    = 16.0
disk_gb   = 20.0

[tool.hardware.gpu]
required     = true
min_vram_gb  = 16
cuda_version = "11.1"

[tool.entrypoint]
command       = "run_inference.py"
args_template = "inference.model_directory_path=/app/RFdiffusion/models inference.output_prefix={designs}/design inference.num_designs=10 'contigmap.contigs=[150-150]' diffuser.T=50"
cache_paths   = [ "/app/RFdiffusion/schedules",]

[tool.binaries]
exposed = [ "run_inference.py",]
