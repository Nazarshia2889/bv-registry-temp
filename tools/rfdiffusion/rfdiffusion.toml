[tool]
id          = "rfdiffusion"
version     = "1.0.0"
description = "De novo protein backbone generation using denoising diffusion built on the RoseTTAFold architecture. Supports unconditional monomer design, protein-protein binder design (with hotspot residues), motif scaffolding, symmetric oligomer design, and fold conditioning. Outputs PDB backbone structures ready for inverse folding with ProteinMPNN."
homepage    = "https://github.com/RosettaCommons/RFdiffusion"
license     = "BSD"
tier        = "core"
maintainers = ["github:RosettaCommons"]


[tool.image]
backend   = "docker"
reference = "rosettacommons/rfdiffusion:latest"


[tool.hardware]
cpu_cores = 4
ram_gb    = 16.0
disk_gb   = 10.0


[tool.hardware.gpu]
required     = false
recommended  = true
min_vram_gb  = 8
cuda_version = "11.8"


[[tool.inputs]]
name        = "input_pdb"
type        = "file_path"
entity      = "protein_structure"
format      = "pdb"
cardinality = "one"
required    = false
hydra_key   = "inference.input_pdb"
description = "Path to the input PDB file. Required for binder design (target structure), motif scaffolding, and fold conditioning. Not required for unconditional monomer generation."


[[tool.inputs]]
name        = "output_prefix"
type        = "str"
entity      = "output_path_prefix"
cardinality = "one"
required    = true
description = "Output path prefix including directory, e.g. 'results/design'. Output PDBs will be named <prefix>_0.pdb, <prefix>_1.pdb, etc."


[[tool.inputs]]
name        = "contigs"
type        = "str"
entity      = "contig_string"
cardinality = "one"
required    = true
description = "Contig specification defining the design problem. Examples: '[100]' for a 100-residue monomer; '[A1-150/0 70-100]' for a binder to chain A residues 1-150; '[A10-25/0 B1-100]' for motif scaffolding of residues A10-25 in a 100-residue context."


[[tool.inputs]]
name        = "num_designs"
type        = "int"
entity      = "num_designs"
cardinality = "one"
required    = false
default     = 10
description = "Number of backbone designs to generate."


[[tool.inputs]]
name        = "hotspot_res"
type        = "str"
entity      = "hotspot_residues"
cardinality = "one"
required    = false
default     = ""
hydra_key   = "ppi.hotspot_res"
description = "Hotspot residues on the target for binder design, e.g. '[A30,A33,A34]'. Specifies which target residues the binder must contact. Recommend 3-6 hotspots."


[[tool.inputs]]
name        = "model_checkpoint"
type        = "enum"
entity      = "model_checkpoint_name"
values      = ["Base_ckpt.pt", "Base_epoch8_ckpt.pt", "Complex_base_ckpt.pt", "Complex_Fold_base_ckpt.pt"]
cardinality = "one"
required    = false
default     = "Complex_base_ckpt.pt"
description = "Model checkpoint to use. 'Complex_base_ckpt.pt' for binder/PPI design. 'Base_ckpt.pt' for unconditional monomer design. 'Complex_Fold_base_ckpt.pt' for fold-conditioned design."


[[tool.inputs]]
name        = "num_timesteps"
type        = "int"
entity      = "diffusion_timesteps"
cardinality = "one"
required    = false
default     = 50
description = "Number of diffusion timesteps for inference. Default: 50. Original training used 200; higher values increase quality at the cost of runtime."


[[tool.inputs]]
name        = "noise_scale_ca"
type        = "float"
entity      = "noise_scale_ca"
cardinality = "one"
required    = false
default     = 1.0
description = "Noise scale for CA atom positions during denoising. Set to 0 for binder design (recommended). Default: 1.0."


[[tool.inputs]]
name        = "noise_scale_frame"
type        = "float"
entity      = "noise_scale_frame"
cardinality = "one"
required    = false
default     = 1.0
description = "Noise scale for backbone frames during denoising. Set to 0 for binder design (recommended). Default: 1.0."


[[tool.inputs]]
name        = "extra_overrides"
type        = "list[str]"
entity      = "hydra_overrides"
cardinality = "many"
required    = false
default     = []
description = "Additional Hydra-style overrides passed directly to run_inference.py, e.g. ['scaffoldguided.scaffoldguided=True']. For advanced use cases."


[[tool.outputs]]
name             = "pdb_files"
type             = "list[pdb_file_path]"
entity           = "protein_backbone_structure"
format           = "pdb"
cardinality_with = "trb_files"
description      = "Generated backbone PDB files, one per design, named <output_prefix>_<N>.pdb. Contain only backbone atoms (N, CA, C, O) and are ready for inverse folding with ProteinMPNN."


[[tool.outputs]]
name             = "trb_files"
type             = "list[file_path]"
entity           = "rfdiffusion_metadata"
format           = "trb"
cardinality_with = "pdb_files"
description      = "Per-design .trb metadata files (pickled dicts) containing contig mapping, trajectory info, and design parameters."


[[tool.outputs]]
name        = "output_dir"
type        = "dir_path"
entity      = "rfdiffusion_output_dir"
format      = "rfdiffusion_output_dir"
description = "Directory containing all output files, including PDBs, .trb metadata, and traj/ subdirectory with trajectory structures."


[tool.entrypoint]
command       = "python"
args_template = "scripts/run_inference.py inference.output_prefix={output_prefix} contigmap.contigs='{contigs}' inference.num_designs={num_designs} diffuser.T={num_timesteps} denoiser.noise_scale_ca={noise_scale_ca} denoiser.noise_scale_frame={noise_scale_frame} inference.ckpt_override_path=models/{model_checkpoint} {extra_overrides}"
# Hydra-style overrides are passed positionally — no flags, no dashes.
# Must use shell=True at runtime so the single quotes around {contigs} are
# interpreted by the shell and not stripped by subprocess list parsing.
# Optional fields rendered only when set:
#   inference.input_pdb={input_pdb}     (when input_pdb is provided)
#   ppi.hotspot_res={hotspot_res}       (when hotspot_res is provided)
#   {extra_overrides} expands the list items space-separated.

# Model weights (~1.5 GB total) are bundled in the image under models/.
cache_paths = ["/cache/rfdiffusion"]


[tool.binaries]
exposed = ["scripts/run_inference.py"]