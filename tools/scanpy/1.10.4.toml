[tool]
id = "scanpy"
version = "1.10.4"
description = "Single-cell analysis in Python (preprocessing, embedding, clustering, DE)"
homepage = "https://scanpy.readthedocs.io/"
license = "BSD-3-Clause"
tier = "core"
maintainers = ["github:scverse"]

[[tool.inputs]]
name = "h5ad"
type = "file"
cardinality = "one"
description = "AnnData (.h5ad) input"

[[tool.outputs]]
name = "h5ad_out"
type = "file"
cardinality = "one"
description = "Processed AnnData"

[tool.image]
backend = "docker"
reference = "ghcr.io/tejasprabhune/bv-pkg/scanpy:1.10.4"

[tool.hardware]
cpu_cores = 8
ram_gb = 32.0
disk_gb = 20.0

[tool.entrypoint]
command = "python"

[tool.binaries]
exposed = ["python"]

# scanpy is a Python library; invoke via `bv exec python -m scanpy …` or in your own scripts.

[tool.factored]
spec_path = "specs/scanpy/1.10.4.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/scanpy:1.10.4"
image_digest = "sha256:d49fbc8e4e328f15713aff82952b9c813b3b5141a242a2aa17a7c064d3b6d2b8"
