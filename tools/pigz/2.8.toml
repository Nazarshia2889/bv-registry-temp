[tool]
id = "pigz"
version = "2.8"
description = "Parallel gzip implementation"
homepage = "https://zlib.net/pigz/"
license = "Zlib"
tier = "community"
maintainers = ["github:madler"]

[[tool.inputs]]
name = "input"
type = "file"
cardinality = "one"
description = "File to compress or decompress"

[[tool.outputs]]
name = "output"
type = "file"
cardinality = "one"
description = "Compressed or decompressed file"

[tool.image]
backend = "docker"
reference = "ghcr.io/tejasprabhune/bv-pkg/pigz:2.8"

[tool.hardware]
cpu_cores = 8
ram_gb = 4.0
disk_gb = 50.0

[tool.entrypoint]
command = "pigz"

[tool.binaries]
exposed = ["pigz", "unpigz"]

[tool.factored]
spec_path = "specs/pigz/2.8.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/pigz:2.8"
image_digest = "sha256:e6aa823bd4210274bf943ad56a81ab5b8883f43e3bb10ed001662fac69af368c"
