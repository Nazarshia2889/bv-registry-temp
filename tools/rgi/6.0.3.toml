[tool]
id = "rgi"
version = "6.0.3"
description = "Resistance Gene Identifier (CARD database)"
homepage = "https://github.com/arpcard/rgi"
license = "Apache-2.0"
tier = "community"
maintainers = [ "github:arpcard",]
cache_paths = [ "/cache/rgi",]
[[tool.inputs]]
name = "fasta"
type = "fasta"
cardinality = "one"
description = "Nucleotide or protein FASTA"

[[tool.outputs]]
name = "out"
type = "tabular"
cardinality = "one"
description = "RGI hit table"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/rgi:6.0.3--pyha8f3691_1"

[tool.hardware]
cpu_cores = 4
ram_gb = 8.0
disk_gb = 10.0

[tool.entrypoint]
command = "rgi"

[tool.binaries]
exposed = [ "rgi",]

[tool.factored]
spec_path = "specs/rgi/6.0.3.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/rgi:6.0.3"
image_digest = "sha256:ea1a6681181fa52870b9ecc65b89ba7aee7d0a74d5d227c0f41d1c0419c15658"
