[tool]
id = "centrifuge"
version = "1.0.4"
description = "Classifier for metagenomic sequences"
homepage = "https://github.com/DaehwanKimLab/centrifuge"
license = "GPL-3.0-only"
tier = "community"
maintainers = [ "github:DaehwanKimLab",]
[[tool.inputs]]
name = "reads"
type = "fastq"
cardinality = "one"
description = "Input sequencing reads (FASTQ or FASTA)"

[[tool.outputs]]
name = "classifications"
type = "tabular"
cardinality = "one"
description = "Per-read taxonomic classification results"

[tool.metadata]
upstream_version = "1.0.4.2"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/centrifuge:1.0.4--hd03093a_0"
digest = "sha256:024d696d29f8d781c0c43b6836f6ad1983046d4adaa17e4068dd2f267142a3df"

[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 20.0

[tool.entrypoint]
command = "centrifuge"

[tool.binaries]
exposed = [ "centrifuge", "centrifuge-build", "centrifuge-inspect",]

[tool.factored]
spec_path = "specs/centrifuge/1.0.4.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/centrifuge:1.0.4"
image_digest = "sha256:d6b9ec8ac5caff6a52e355c0ab7977b3a9cfb700a2e216de8bff07737af2398e"
