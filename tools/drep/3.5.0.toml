[tool]
id = "drep"
version = "3.5.0"
description = "Dereplicate genome sets to species-level representatives"
homepage = "https://github.com/MrOlm/drep"
license = "MIT"
tier = "community"
maintainers = ["github:MrOlm"]

[[tool.inputs]]
name = "genomes"
type = "dir"
cardinality = "one"
description = "Genome directory"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Dereplicated genomes"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/drep:3.5.0--pyhdfd78af_0"

[tool.hardware]
cpu_cores = 8
ram_gb = 32.0
disk_gb = 50.0

[tool.entrypoint]
command = "dRep"

[tool.binaries]
exposed = ["dRep"]

[tool.factored]
spec_path = "specs/drep/3.5.0.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/drep:3.5.0"
image_digest = "sha256:116382c0f1b2bb8b134657d5e7e1047ab512b42c4d388ca3cf4e2c051a8d55bb"
