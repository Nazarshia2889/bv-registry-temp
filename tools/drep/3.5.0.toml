[tool]
id = "drep"
version = "3.5.0"
description = "Dereplicate genome sets to species-level representatives"
homepage = "https://github.com/MrOlm/drep"
license = "MIT"
tier = "community"
maintainers = ["github:MrOlm"]

[[tool.inputs]]
name = "genomes"
type = "dir"
cardinality = "one"
description = "Genome directory"

[[tool.outputs]]
name = "outdir"
type = "dir"
cardinality = "one"
description = "Dereplicated genomes"

[tool.image]
backend = "docker"
reference = "quay.io/biocontainers/drep:3.5.0--pyhdfd78af_0"

[tool.hardware]
cpu_cores = 8
ram_gb = 32.0
disk_gb = 50.0

[tool.entrypoint]
command = "dRep"

[tool.binaries]
exposed = ["dRep"]
