# Fold a sequence and search for structural homologs.
# FASTA -> ColabFold -> Foldseek + TM/US-align -> hit table

[project]
name = "structure-search"
description = "Fold a query sequence and search for structural homologs"

[tools]
colabfold = "1.6.1"
foldseek  = "10.941cd33"
